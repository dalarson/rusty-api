spring.application.name=${SPRING_APPLICATION_NAME:rusty-api}
spring.cloud.azure.cosmos.database=${SPRING_CLOUD_AZURE_COSMOS_DATABASE:}
spring.cloud.azure.cosmos.endpoint=${SPRING_CLOUD_AZURE_COSMOS_ENDPOINT:}
spring.cloud.azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=-1
applicationinsights.configuration.file=${APPLICATION_INSIGHTS_CONFIGURATION_FILE}

# Auth
auth.jwt.secret=${JWT_SECRET:rusty-rhino-dev-secret-change-in-production-min32bytes}
auth.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Admin users: add auth.admin.userN.username/password for as many users as needed
auth.admin.user1.username=${ADMIN_USER_1:}
auth.admin.user1.password=${ADMIN_PASS_1:}
auth.admin.user2.username=${ADMIN_USER_2:}
auth.admin.user2.password=${ADMIN_PASS_2:}
auth.admin.user3.username=${ADMIN_USER_3:}
auth.admin.user3.password=${ADMIN_PASS_3:}
auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.rusty_rhino.rusty_api.auth=DEBUG